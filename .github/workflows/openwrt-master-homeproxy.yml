name: openwrt-master-homeproxy

# 工作流触发方式：手动触发(核心)+定时触发+仓库事件触发
on:
  repository_dispatch:
  schedule:
    - cron: 0 21 * * *
  workflow_dispatch:
    inputs:
      ssh:
        description: '输入true开启 SSH'
        required: false
        default: 'false'

# 全局环境变量：统一管理，一键修改
env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: config/x86/config.buildinfo
  CONFIG_URL: https://raw.githubusercontent.com/sdhz150/Actions-OpenWrt/refs/heads/main/config/x86/config.buildinfo
  OFFICIAL_CONFIG_URL: https://raw.githubusercontent.com/sdhz151/Actions-OpenWrt/refs/heads/main/config/x86/config.buildinfo
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  CACHE_TRADEMARK: homeproxy

# 核心编译任务：单任务串行，Ubuntu24.04环境
jobs:
  build:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    
    # 🌟 关键权限开通：允许官方自带的 GITHUB_TOKEN 执行创建、删除等写入操作
    permissions:
      contents: write
      actions: write

    steps:
      # 步骤1：检出仓库本地配置
      - name: 检出仓库本地配置
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1

      # 步骤2：打印代码检出完成通知
      - name: 通知-代码检出完成
        run: |
          set -euo pipefail
          echo "STEP: Checkout code completed — $(date +%Y-%m-%d\ %H:%M:%S)"

      # 步骤3：初始化编译环境（安装依赖+清理系统）
      - name: 初始化编译环境（安装依赖+清理系统）
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename \
            libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev \
            libffi-dev meson ninja-build pkg-config
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo timedatectl set-timezone "${{ env.TZ }}"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          echo "🔧 系统核心数: $(nproc)"
          echo "🔧 剩余磁盘空间: $(df -h /workdir | awk 'NR==2{print $4}')"
          echo "STEP: Initialize build environment completed — $(date +%Y-%m-%d\ %H:%M:%S)"

      # 步骤4：开启SSH远程调试（核心修复：解决手动连接失败，仅手动触发开启）
      - name: 开启SSH远程调试（仅手动触发时生效）
        uses: mxschmitt/action-tmate@v3
        if: github.event.inputs.ssh == 'true'
        with:
          limit-access-to-actor: true  # 仅仓库所有者可连接，安全防护

      # 步骤5：克隆OpenWrt官方源码
      - name: 克隆OpenWrt官方源码
        working-directory: /workdir
        run: |
          set -euo pipefail
          git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
          cd openwrt
          echo "🔧 OpenWrt 版本: $(git log --oneline -1 | head -n1)"
          echo "STEP: Clone OpenWrt source code completed — $(date +%Y-%m-%d\ %H:%M:%S)"

      # 步骤6：加载自定义Feeds配置+执行前置DIY脚本
      - name: 加载自定义Feeds配置+执行前置DIY脚本
        run: |
          set -euo pipefail
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH
          echo "STEP: Load custom feeds configuration completed — $(date +%Y-%m-%d\ %H:%M:%S)"

      # 步骤7：更新所有OpenWrt Feeds源（官方）
      - name: 更新所有OpenWrt Feeds（官方）
        run: |
          set -euo pipefail
          cd openwrt
          ./scripts/feeds update -a
          echo "🔧 Feeds源更新已完成"
          echo "STEP: Update all OpenWrt feeds completed — $(date +%Y-%m-%d\ %H:%M:%S)"

      # 步骤8：克隆核心插件
      - name: 克隆mosdns/geodata/homeproxy/openwrt-app核心插件
        run: |
          set -euo pipefail
          cd openwrt
          # 克隆重试函数：网络波动时自动重试3次，提升成功率
          git_clone_retry() {
            local url=$1 branch=$2 dir=$3
            for i in 1 2 3; do
              if git clone --depth 1 $url -b $branch $dir; then
                echo "✅ 克隆成功: $dir"
                return 0
              fi
              echo "⚠️  第$i次克隆失败，5秒后重试..."
              sleep 5
            done
            echo "❌ 3次克隆均失败，终止执行"
            exit 1
          }
          # 克隆各核心功能插件
          git_clone_retry https://github.com/sbwml/luci-app-mosdns.git v5 package/mosdns
          git_clone_retry https://github.com/sbwml/v2ray-geodata.git master package/v2ray-geodata
          git_clone_retry https://github.com/sdhz151/openwrt-app.git main package/app
          git_clone_retry https://github.com/immortalwrt/homeproxy.git master package/homeproxy

          # 移除冲突的官方包
          if [ -d "feeds/packages/net/v2ray-geodata" ]; then
            rm -rf feeds/packages/net/v2ray-geodata
            echo "🔧 已删除官方Feeds冲突的v2ray-geodata包"
          fi

      # 步骤8.5：安装sing-box插件（immortalwrt最新版，避免版本冲突）
      - name: 安装sing-box插件（immortalwrt最新版）
        run: |
          set -euo pipefail
          cd openwrt
          mkdir -p package/singbox
          cd package/singbox
          git init
          git remote add origin https://github.com/immortalwrt/packages.git
          git config core.sparsecheckout true
          echo "net/sing-box" >> .git/info/sparse-checkout
          git pull --depth 1 origin master
          echo "🔧 sing-box包克隆完成"
          echo "STEP: update sing-box completed — $(date +%Y-%m-%d\ %H:%M:%S)"

      # 步骤9：处理插件软链接/目录结构+清理冗余文件
      - name: 处理插件软链接/目录结构（适配编译规则）
        id: process-softlink
        run: |
          set -euo pipefail
          cd openwrt
          [ -d "package/app/brutal" ] && mv package/app/brutal package/
          [ -d "package/app/vlmcsd" ] && mv package/app/vlmcsd package/
          [ -d "package/app/luci-app-vlmcsd" ] && mv package/app/luci-app-vlmcsd feeds/luci/applications/
          mkdir -p package/feeds/luci
          ln -sf ../../../feeds/luci/applications/luci-app-vlmcsd package/feeds/luci/luci-app-vlmcsd
          # 替换官方sing-box为最新版，避免编译冲突
          rm -rf feeds/packages/net/sing-box/*
          rsync -a package/singbox/net/sing-box/* feeds/packages/net/sing-box
          rm -rf package/singbox
          # 清理冗余目录，保持编译环境整洁
          [ -d "package/app" ] && rm -rf package/app
          echo "🔧 插件软链接处理完成"
          echo "🔧 冗余目录清理完成"
          echo "STEP: Process package soft links completed — $(date +%Y-%m-%d\ %H:%M:%S)"

      # 步骤10：安装所有OpenWrt Feeds软件包（官方）
      - name: 安装所有OpenWrt Feeds软件包
        run: |
          set -euo pipefail
          cd openwrt
          ./scripts/feeds install -a
          echo "🔧 Feeds 安装完成，总包数: $(ls package/feeds/ | wc -l)"
          echo "STEP: Install all OpenWrt feeds completed — $(date +%Y-%m-%d\ %H:%M:%S)"

      # 步骤11：三级配置加载
      - name: 加载编译配置（三级加载：本地→自定义远程→官方默认）
        run: |
          set -euo pipefail
          # 复制自定义files目录到源码，集成固件默认配置
          [ -e files ] && mv files openwrt/files/
          # 统一配置目标路径，避免重复书写
          TARGET_CONFIG="openwrt/.config"
          # 第一级：优先使用本地配置
          if [ -f "${{ env.CONFIG_FILE }}" ]; then
              echo "✅ 检测到本地配置文件，优先加载: ${{ env.CONFIG_FILE }}"
              cp ${{ env.CONFIG_FILE }} $TARGET_CONFIG
              echo "🔧 本地配置文件已成功复制到源码目录"
          else
              echo "ℹ️  未找到本地配置文件: ${{ env.CONFIG_FILE }}"
              # 第二级：本地无配置，加载自定义远程配置
              if [ -n "${{ env.CONFIG_URL }}" ]; then
                  echo "🔄 尝试加载自定义远程配置文件: ${{ env.CONFIG_URL }}"
                  wget -q -O $TARGET_CONFIG "${{ env.CONFIG_URL }}"
                  # 校验远程配置是否有效
                  if [ -s $TARGET_CONFIG ]; then
                      echo "✅ 自定义远程配置文件下载并加载成功"
                  else
                      echo "❌ 自定义远程配置文件下载失败/为空，加载官方默认配置"
                      rm -f $TARGET_CONFIG
                      # 第三级：远程配置失效，加载OpenWrt官方 x86_64默认配置
                      wget -q -O $TARGET_CONFIG "${{ env.OFFICIAL_CONFIG_URL }}"
                      if [ -s $TARGET_CONFIG ]; then
                          echo "✅ OpenWrt官方 x86_64配置加载成功"
                      else
                          echo "❌ 官方配置下载失败，将使用源码默认配置"
                          rm -f $TARGET_CONFIG
                      fi
                  fi
              else
                  # 未配置自定义远程，直接加载官方默认配置
                  echo "ℹ️  自定义远程配置未配置，直接加载官方默认配置"
                  wget -q -O $TARGET_CONFIG "${{ env.OFFICIAL_CONFIG_URL }}"
                  if [ -s $TARGET_CONFIG ]; then
                      echo "✅ OpenWrt官方 x86_64配置加载成功"
                  else
                      echo "❌ 官方配置下载失败，将使用源码默认配置"
                      rm -f $TARGET_CONFIG
                  fi
              fi
          fi
          # 进入源码目录，补全缺失配置项，避免编译报错
          cd openwrt
          echo "🔧 执行 make defconfig 补全缺失配置项..."
          make defconfig >/dev/null 2>&1
          echo "STEP: Load build configuration completed — $(date +%Y-%m-%d\ %H:%M:%S)"

      # 步骤12：执行后置DIY脚本+应用优化补丁
      - name: 执行后置DIY脚本+应用优化补丁
        run: |
          set -euo pipefail
          # 赋予脚本执行权限，确保可运行
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH
          
          # 强制开启核心插件，无需手动在.config中配置
          echo "CONFIG_PACKAGE_kmod-tcp-brutal=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-vlmcsd=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-vlmcsd-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_vlmcsd=y" >> .config
          # 开启homeproxy插件，写入.config配置文件，编译系统自动识别
          echo "CONFIG_PACKAGE_luci-app-homeproxy=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_sing-box=y" >> .config
          echo "CONFIG_PACKAGE_sing-box-tiny=m" >> .config
          # 再次补全配置，确保新增项生效
          make defconfig >/dev/null 2>&1
          echo "🔧 固件配置加载&优化补丁应用完成，核心插件已强制开启"
          echo "STEP: Load custom firmware configuration completed — $(date +%Y-%m-%d\ %H:%M:%S)"

      # 步骤13：预下载所有编译依赖包
      - name: 预下载所有编译依赖包
        run: |
          set -euo pipefail
          cd openwrt
          # 多线程预下载，使用服务器全部CPU核心
          make download -j$(nproc) >/dev/null 2>&1
          # 删除空/损坏文件，避免编译中断
          find dl -size -1k -exec rm -f {} \;
          echo "🔧 依赖包下载完成，共下载: $(ls dl/ | wc -l) 个文件"
          echo "STEP: Download dependent packages completed — $(date +%Y-%m-%d\ %H:%M:%S)"

      # 步骤14：构建Host工具链（tools/toolchain）
      - name: 构建Host工具链（tools/toolchain）
        run: |
          set -euo pipefail
          cd openwrt
          echo "🚀 开始构建 Host 工具链 (tools/install)..."
          make tools/install -j$(nproc) || make tools/install -j1 V=s
          echo "🚀 开始构建 Toolchain..."
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s
          echo "✅ Host 工具链构建完成"
          echo "STEP: Build host tools completed — $(date +%Y-%m-%d\ %H:%M:%S)"

      # 步骤15：单线程编译glib2
      - name: 单线程编译glib2
        run: |
          set -euo pipefail
          cd openwrt
          make package/feeds/packages/glib2/clean
          make package/feeds/packages/glib2/compile V=s -j1
          echo "🔧 glib2单线程编译安装完成，可正常多线程编译固件"
          echo "STEP: Compile glib2 with single thread completed — $(date +%Y-%m-%d\ %H:%M:%S)"

      # 步骤16：编译OpenWrt固件
      - name: 编译OpenWrt固件（多线程编译，失败自动单线程查错）
        run: |
          set -euo pipefail
          cd openwrt
          export MAKEFLAGS="-j$(nproc)"
          echo "🚀 开始编译，使用 $(nproc) 线程"
          echo "🚀 编译开始时间: $(date +%Y-%m-%d\ %H:%M:%S)"
          # 容错逻辑：多线程失败→单线程→单线程详细日志，便于定位错误
          make || make -j1 || make -j1 V=s
          # 提取设备名称，用于固件命名
          DEVICE_NAME=$(grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' || echo "x86_64")
          echo "DEVICE_NAME=${DEVICE_NAME}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "✅ 固件编译完成"
          echo "STEP: Compile OpenWrt firmware completed — $(date +%Y-%m-%d\ %H:%M:%S)"

      # 步骤17：上传固件到GitHub Artifact
      - name: 上传固件-GitHub Artifact（临时存储）
        uses: actions/upload-artifact@v7.0.0
        if: job.status == 'success'
        with:
          name: OpenWrt_${{ env.DEVICE_NAME }}_nftables_${{ env.BUILD_DATE }}
          path: /workdir/openwrt/bin/targets/
          retention-days: 2
          if-no-files-found: error

      # 步骤18：发布固件到GitHub Release
      - name: 发布固件-GitHub Release（长期存储）
        uses: softprops/action-gh-release@v3.0.2
        if: ${{ env.UPLOAD_RELEASE == 'true' && success() }}
        with:
          files: |
            /workdir/openwrt/bin/targets/**/*.bin
            /workdir/openwrt/bin/targets/**/*.img.gz
            /workdir/openwrt/bin/targets/**/*.buildinfo
            /workdir/openwrt/bin/targets/**/*.manifest
            /workdir/openwrt/bin/targets/**/sha256sums
            /workdir/openwrt/bin/targets/**/*.json
          tag_name: OpenWrt-${{ env.REPO_BRANCH }}-${{ env.DEVICE_NAME }}-${{ env.BUILD_DATE }}-${{ github.run_id }}
          name: OpenWrt-${{ env.REPO_BRANCH }}-${{ env.DEVICE_NAME }}-${{ env.CACHE_TRADEMARK }}-${{ env.BUILD_DATE }}-${{ github.run_id }}
          body: |
            ## 📦 OpenWrt  固件编译结果
            - 固件架构: ${{ env.DEVICE_NAME }} (x86_64)
            - 内核规则: nftables（新一代内核防火墙，性能更优）
            - 核心插件: homeproxy/mosdns/vlmcsd
            - 编译时间: ${{ env.BUILD_DATE }}
            - SSH调试: 支持手动触发开启，仅仓库所有者可连接
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # 步骤19：删除旧的工作流运行记录
      - name: 删除旧的工作流运行
        if: job.status == 'success'
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1

      # 步骤20：移除旧版本Release
      - name: 移除旧版本Release
        uses: ophub/delete-releases-workflows@main
        if: ${{ env.UPLOAD_RELEASE == 'true' && success() }}
        with:
          delete_releases: true
          releases_keep_latest: 4
          delete_tags: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # 步骤21：完成通知
      - name: 完成通知
        if: always()
        run: |
          set -euo pipefail
          echo "========================================"
          echo "🚀 编译流程执行完成"
          echo "⏰ 结束时间: $(date +%Y-%m-%d\ %H:%M:%S)"
          echo "========================================"
